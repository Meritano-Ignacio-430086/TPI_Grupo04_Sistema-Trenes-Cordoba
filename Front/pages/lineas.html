<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Líneas - RielCBA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/estilos.css" rel="stylesheet">
</head>
<body>

    <!-- menu -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="bi bi-train-front"></i> RielCBA</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="lineas.html">Líneas</a></li>
                    <li class="nav-item"><a class="nav-link" href="tickets.html">Tickets</a></li>
                    <li class="nav-item"><a class="nav-link" href="soporte.html">Mantenimiento</a></li>
                    <li class="nav-item"><a class="nav-link" href="acerca.html">Acerca de</a></li>
                </ul>
                <a href="login.html" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4">Trenes por línea</h2>

        <!-- busqueda -->
        <div class="card p-3 mb-4">
            <form id="formBuscar" class="row g-2">
                <div class="col-md-9">
                    <input type="number" id="nroLinea" class="form-control" min="1" step="1"
                           placeholder="Número de línea" required autofocus>
                </div>
                <div class="col-md-3">
                    <button type="submit" id="btnBuscar" class="btn btn-primary w-100">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                </div>
            </form>
        </div>
                <h2 class="mb-4">Buscar por chofer</h2>
        <div class="card p-3 mb-4">
            <form id="formBuscar" class="row g-2">
                <div class="col-md-9">
                    <input type="number" id="nroLinea" class="form-control" min="1" step="1"
                           placeholder="Nombre de chofer" required autofocus>
                </div>
                <div class="col-md-3">
                    <select class="form-select form-select-md mb-3" aria-label=".form-select-lg example">
  <option selected>Estado del chofer</option>
  <option value="1">Todos</option>
  <option value="2">Activo</option>
  <option value="3">Inactivo</option>
</select>
                    <button type="submit" id="btnBuscar" class="btn btn-primary w-100">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                </div>
            </form>
        </div>
        <!-- mensajes (error / sin resultados) -->
        <div id="mensaje" class="alert d-none" role="alert"></div>

        <!-- resultados -->
        <div id="resultados" class="d-none">
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="card p-3 h-100">
                        <span class="text-muted">Línea <span id="resNroLinea"></span></span>
                        <span class="numero" id="resRecorrido"></span>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card p-3 h-100">
                        <span class="text-muted">Estaciones en el recorrido</span>
                        <span class="numero" id="resEstaciones"></span>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card p-3 h-100">
                        <span class="text-muted">Trenes asignados</span>
                        <span class="numero" id="resTrenes"></span>
                    </div>
                </div>
            </div>

            <div class="card p-3">
                <h5 class="mb-3">Trenes de la línea</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Unidad</th>
                                <th>Modelo</th>
                                <th>Estado</th>
                                <th class="text-end">Vagones</th>
                                <th class="text-end">Capacidad</th>
                                <th class="text-end">Mantenimientos</th>
                                <th>Último mantenimiento</th>
                            </tr>
                        </thead>
                        <tbody id="tablaTrenes"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/lineas.js"></script>
</body>
</html>
