<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Sistema Trenes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/Front/css/estilos.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="">
        <div class="text-center m-4">
            <i class="bi bi-train-freight-front text-primary fs-1"></i>
            <h3>Sistema de Trenes</h3>
        </div>
        <div class="card p-4 shadow">
            <form>
            <div class="text-center">
                <h5>Iniciar Sesión</h5>
            </div>

            <div class="p-2">
                <h6>Usuario</h6>
                <input type="text" class="form-control" required>
            </div>
            <div class="p-2">
                <h6>Contraseña</h6>
                <input type="password" class="form-control" required>
            </div>
            <div class="p-2">
                <button class="btn btn-primary rounded-3 p-2 w-100">Ingresar</button>
            </div>
            </form>
            <p class="text-center mt-3"><a href="index.html">Volver al inicio</a></p>
        </div>
    </div>

</body>
</html>
