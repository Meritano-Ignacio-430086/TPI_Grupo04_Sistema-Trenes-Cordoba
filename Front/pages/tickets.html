<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tickets Prime - MIL</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/estilos.css" rel="stylesheet" />
  </head>
  <body>
    <!--MENU TICKETTT-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html"
          ><i class="bi bi-train-front"></i> RielCBA</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="dashboard.html">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="lineas.html">Líneas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="tickets.html">Tickets</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="soporte.html">Mantenimiento</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="acerca.html">Acerca de</a>
            </li>
          </ul>
          <a href="login.html" class="btn btn-outline-light btn-sm"
            >Cerrar sesión</a
          >
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Tickets</h2>
        <button
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#modalTicket"
        >
          <i class="bi bi-plus"></i> Nuevo ticket
        </button>
      </div>

      <div class="card p-3">
        <!-- Búsqueda  -->
        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <input
              type="text"
              class="form-control"
              placeholder="Buscar por número de DNI"
            />
          </div>
          <div class="col-md-3">
            <select class="form-select">
              <option>Todos los estados</option>
              <option>Pagado</option>
              <option>Pendiente</option>
              <option>Anulado</option>
            </select>
          </div>
        </div>
        <div class="col-md-3">
          <button class="btn btn-secondary w-100">Buscar</button>
        </div>
      </div>

      <!-- Tabla -->
      <div class="table"></div>
    </div>
    <!-- Modal -->
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">Nueva factura</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">...</div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-primary">Guardar cambios</button>
          </div>
        </div>
      </div>
    </div>

    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Facturas</h2>
        <button
          type="button"
          class="btn btn-primary"
          id="myInput"
          data-bs-toggle="modal"
          data-bs-target="#exampleModal"
        >
          <i class="bi bi-plus"></i> Nueva factura
        </button>
      </div>

      <div class="card p-3">
        <!-- Búsqueda  -->
        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <input
              type="text"
              class="form-control"
              placeholder="Buscar por número de Factura"
            />
          </div>
          <div class="col-md-3">
            <select class="form-select">
              <option>Todos los estados</option>
              <option>Pagado</option>
              <option>Pendiente</option>
              <option>Anulado</option>
            </select>
          </div>
        </div>
        <div class="col-md-3">
          <button class="btn btn-secondary w-100">Buscar</button>
        </div>
      </div>

      <!-- Tabla -->
      <div class="table"></div>
    </div>
    <!-- modal: alta / modificacion -->
    <div></div>

    <!--Modal: confirmar baja-->
    <div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/tickets.js"></script>
  </body>
</html>
